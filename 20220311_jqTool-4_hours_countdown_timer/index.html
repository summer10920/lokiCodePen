<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@669&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.5.1.js" integrity="sha256-QWo7LDvxbWT2tbbQ97B53yJnYU3WhH/C8ycbRAkjPDc="
    crossorigin="anonymous"></script>
</head>

<body>
  <div class="time">
    <div class="digi">
      <div class="add"></div>
      <div data-time="Hours">04</div>
      <div class="sub"></div>
    </div>
    <div>:</div>
    <div class="digi">
      <div class="add"></div>
      <div data-time="Minutes">00</div>
      <div class="sub"></div>
    </div>
    <div>:</div>
    <div class="digi">
      <div class="add"></div>
      <div data-time="Seconds">00</div>
      <div class="sub"></div>
    </div>
    <div>:</div>
    <div class="digi">
      <div class="add"></div>
      <div data-time="Milliseconds">00</div>
      <div class="sub"></div>
    </div>
  </div>
  <div class="control">
    <div class="play"></div>
    <div class="reset"></div>
  </div>
  <script src="loki.js"></script>
</body>

</html>
